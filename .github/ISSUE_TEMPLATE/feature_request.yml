name: Feature request
description: 提议一个可验证的新能力
title: "✨ feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到了什么限制？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述用户流程、边界和不做什么。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 用可观察、可测试的条件列出完成定义。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与实验
      description: 已尝试的方案、结果和取舍。

