name: Bug report
description: 报告可复现的缺陷或回归
title: "🐛 bug: "
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为系统应该怎样工作？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？请去除密钥和隐私数据。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: OS、Python、Node、浏览器和 commit SHA。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先删去 token、Cookie、Authorization 和个人信息。

